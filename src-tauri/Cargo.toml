[package]
name = "vut"
version = "0.1.0"
edition = "2021"
authors = ["olle_norstrom"]
description = "Very Useful Tool - a keyboard-driven launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
# Already pulled in transitively by tauri-plugin-updater, so this adds no
# new dependency weight - just a direct name so plugin_http_fetch (see
# launcher.rs) can use it too. Plugin HTTP calls are proxied through this
# Rust command instead of the webview's fetch() because the latter is
# subject to real browser CORS enforcement against whatever arbitrary
# third-party server a plugin targets; a native client has no such
# restriction and needs no capability/scope wiring for the same "arbitrary
# user-configured target" reason open_target bypasses opener's JS binding.
reqwest = "0.13"

# Only needed for the EWMH _NET_ACTIVE_WINDOW nudge in show_main_window (see
# the comment there) - X11-specific, and already pulled in transitively by
# tauri-plugin-global-shortcut on these targets, so this adds no new
# transitive dependency, just a direct name for our own code to use it too.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
x11rb = "0.13"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
